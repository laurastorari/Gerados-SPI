<!DOCTYPE html>
<html lang="pt-BR"><head>
<meta charset="UTF-8">
<!-- Escala correta no celular, COM zoom liberado (pinça / duplo toque) -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Diretoria SPI — Gerados Diário</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{
    --green-dark: #006B3F;
    --green: #079D56;
    --green-mid: #00D38D;
    --green-light: #E7F5ED;
    --ink: #1c2b22;
    --paper: #ffffff;
    --line: #d9e2dc;
    --muted: #6b7d72;
    --red: #e57373;
    --amber: #ffb74d;
    --yellow: #fff176;
    --light-green: #aed581;
    --good-green: #81c784;
    --flight-orange: #FF8B22;
    --flight-gray: #7c8c82;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Verdana', 'Segoe UI', system-ui, -apple-system, Arial, sans-serif;
    background:#eef2ef;
    color:var(--ink);
    padding:6px 10px;
    overflow-x: hidden;
  }
  .wrap{max-width:1380px;margin:0 auto;}

  /* ---- ESTILOS MANTIDOS INTEGRALMENTE ---- */
  .topbar{ display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px; margin-bottom:6px; background:var(--paper);padding:6px 12px 10px;border-radius:6px;border:1px solid var(--line); position:relative;z-index:10;}
  .brand{display:flex;align-items:center;gap:8px;}
  .brand-badge{ width:38px;height:38px;border-radius:50%; background:conic-gradient(from 200deg, var(--green) 0 60%, var(--green-mid) 60% 100%); display:flex;align-items:center;justify-content:center; color:#fff;font-size:9px;font-weight:700;text-align:center;line-height:1.1; border:2px solid var(--green-dark); }
  .brand h1{font-size:15px;margin:0;color:var(--green-dark);letter-spacing:.2px;}
  .brand p{margin:0;font-size:11px;color:var(--muted);font-weight:600;}
  .actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
  .upload-group{position:relative;}
  .btn{ display:inline-flex;align-items:center;justify-content:center;gap:4px; background:var(--green);color:#fff;border:none;border-radius:5px; height:30px;padding:0 10px;font-size:11.5px;font-weight:600;cursor:pointer; transition:background .15s;vertical-align:middle;box-sizing:border-box;}
  .btn:hover{background:var(--green-dark);}
  .btn.secondary{background:#fff;color:var(--green-dark);border:1.5px solid var(--line);}
  .btn.secondary:hover{background:var(--green-light);border-color:var(--green);}
  .btn.accent{background:#fff;color:var(--green-dark);border:2px solid var(--green);}
  .btn.accent:hover{background:var(--green-light);}
  #fileInput{display:none;}
  .file-status{ position:absolute;top:100%;right:0;margin-top:2px; font-size:10px;color:var(--muted);white-space:nowrap;}
  .tabs{ display:flex;gap:6px;margin-bottom:6px;border-bottom:2px solid var(--line);padding-bottom:4px;}
  .tab-btn{ background:transparent;border:none;padding:4px 12px;font-size:11.5px;font-weight:700; color:var(--muted);cursor:pointer;border-radius:5px;transition:all .15s;}
  .tab-btn.active{ background:var(--green);color:#fff;}
  .grid-top{ display:grid;grid-template-columns:320px 1fr;gap:6px;margin-bottom:6px;}
  .col-left{ display:flex;flex-direction:column;gap:6px;}
  .card{ background:var(--paper);border-radius:6px;border:1px solid var(--line); box-shadow:0 1px 2px rgba(0,0,0,.03);}
  .kpi-card{padding:6px 10px;}
  .kpi-row{display:flex;gap:8px;margin-bottom:4px;}
  .kpi{flex:1;}
  .kpi .num{font-size:18px;font-weight:800;color:var(--green-dark);line-height:1;}
  .kpi .num.negative{color:#d32f2f;}
  .kpi .lbl{font-size:10px;color:var(--muted);margin-top:1px;font-weight:600;}
  .kpi-divider{width:1px;background:var(--line);}
  .spi-card{padding:0; overflow-x:auto; -webkit-overflow-scrolling:touch;}
  table.spi-table{width:100%;border-collapse:collapse;font-size:10.5px;margin:0;min-width:300px;}
  table.spi-table th{ background:var(--green);color:#fff;padding:4px 2px;font-size:9.5px; text-align:center;font-weight:700;}
  table.spi-table th:first-child{text-align:center;}
  table.spi-table td{padding:3px 2px;text-align:center;border-bottom:1px solid var(--line);cursor:pointer;}
  table.spi-table td:first-child{text-align:left;font-weight:700;color:var(--green-dark);padding-left:6px;}
  table.spi-table tr:hover td{background:#f1f7f4;}
  table.spi-table tr.total-row td{background:var(--green-light);font-weight:800;color:var(--green-dark);border-top:2px solid var(--green);}
  .gap-cell{border-radius:4px;font-weight:700;padding:1px 2px;display:inline-block;min-width:32px;font-size:9.5px;color:#1c2b22;}
  .chart-card{padding:6px 10px 2px;position:relative;display:flex;flex-direction:column;}
  .chart-card h3{margin:0 0 2px;font-size:11.5px;color:var(--ink);font-weight:700;}
  .chart-wrap{flex:1;min-height:165px;position:relative;}
  .grid-bottom{display:grid;grid-template-columns:1fr 340px;gap:6px;}
  .matrix-card{padding:6px 10px;overflow-x:auto; -webkit-overflow-scrolling:touch;}
  .matrix-card h3{margin:0 0 4px;font-size:11.5px;color:var(--ink);font-weight:700;}
  table.matrix{ border-collapse:collapse; font-size:10px; width:100%; table-layout: fixed;}
  table.matrix th{ background:var(--green); color:#fff; padding:2px 0; font-weight:700; font-size:9px; text-align:center; overflow:hidden; white-space:nowrap;}
  table.matrix th:first-child, table.matrix td:first-child{ text-align:left; padding-left:4px; width:62px; min-width:62px; max-width:62px; overflow:hidden; white-space:nowrap;}
  table.matrix th:not(:first-child):not(:last-child), table.matrix td:not(:first-child):not(:last-child) { width: 20px; min-width: 20px; max-width: 20px; overflow: hidden; white-space: nowrap; padding: 2px 0; }
  table.matrix th:last-child, table.matrix td:last-child { width: 34px; min-width: 34px; max-width: 34px;}
  table.matrix td{ padding:2px 0; text-align:center; border-bottom:1px solid var(--line); color:var(--ink); font-weight:600; font-size:9.5px;}
  table.matrix td:first-child{font-weight:700;color:var(--green-dark);}
  table.matrix tr.total-row td{background:var(--green-light);font-weight:800;border-top:2px solid var(--green);}
  table.matrix td.total-col{font-weight:800;background:#f4f7f5;}
  .week-card{padding:6px 10px;overflow-x:auto; -webkit-overflow-scrolling:touch;}
  .week-card h3{margin:0 0 4px;font-size:11.5px;color:var(--ink);font-weight:700;}
  table.week{width:100%;border-collapse:collapse;font-size:10.5px;min-width:300px;}
  table.week th{background:var(--green);color:#fff;padding:3px 2px;font-weight:700;font-size:9.5px;}
  table.week th:first-child{text-align:left;padding-left:6px;}
  table.week td{padding:3px 2px;text-align:center;border-bottom:1px solid var(--line);}
  table.week td:first-child{text-align:left;font-weight:700;color:var(--green-dark);padding-left:6px;}
  table.week tr.total-row td{background:var(--green-light);font-weight:800;border-top:2px solid var(--green);}
  .status-mini{display:flex;gap:6px;margin-top:4px;padding-top:4px;border-top:1px solid var(--line);}
  .status-mini div{text-align:center;flex:1;cursor:pointer;padding:2px 3px;border-radius:4px;transition:background .15s;}
  .status-mini .n{font-size:12px;font-weight:800;color:var(--green-dark);}
  .status-mini .l{font-size:9px;color:var(--muted);font-weight:600;}
  .empty-state{ text-align:center;padding:40px 20px;color:var(--muted);}
  .empty-state h2{color:var(--green-dark);font-size:15px;margin:0 0 4px;}
  .empty-state p{font-size:11.5px;max-width:360px;margin:0 auto;}
  .warn-banner{ background:#fff6e6;border:1px solid var(--amber);color:#7a5a10; border-radius:5px;padding:4px 8px;font-size:11px;margin-bottom:6px; display:none;align-items:center;gap:6px;}
  .sim-container{padding:10px;}
  .sim-controls{display:flex;gap:10px;align-items:center;margin-bottom:8px;flex-wrap:wrap;}
  .sim-controls select{padding:4px 8px;border:1px solid var(--line);border-radius:5px;font-size:11.5px;}
  .sim-meta-bar{ display:flex;flex-wrap:wrap;gap:6px 10px;align-items:flex-end; background:var(--green-light);border:1px solid var(--green);border-radius:5px; padding:6px 10px;margin-bottom:8px;}
  .sim-meta-bar .sim-meta-title{ width:100%;font-size:10.5px;font-weight:700;color:var(--green-dark);margin-bottom:2px;}
  .sim-meta-field{display:flex;flex-direction:column;gap:2px;align-items:center;}
  .sim-meta-field label{font-size:9.5px;color:var(--green-dark);font-weight:700;text-align:center;}
  .sim-meta-field input{ width:78px;padding:4px 5px;border:1.5px solid var(--green);border-radius:5px; font-size:11.5px;font-weight:700;text-align:center;color:var(--green-dark);background:#fff;}
  .pdv-scroll-wrap{ max-height: 420px; overflow-y: auto; overflow-x: scroll; border-radius:5px; border: 1px solid var(--line); scrollbar-width:auto; scrollbar-color:var(--green) #e3ebe6; -webkit-overflow-scrolling: touch;}
  .pdv-scroll-wrap::-webkit-scrollbar{height:10px;width:7px;}
  .pdv-scroll-wrap::-webkit-scrollbar-track{background:#e3ebe6;border-radius:5px;}
  .pdv-scroll-wrap::-webkit-scrollbar-thumb{background:var(--green);border-radius:5px;}
  table.pdv-table{width:100%;border-collapse:separate;border-spacing:0;font-size:10px;min-width:1000px;}
  table.pdv-table th{background:var(--green);color:#fff;padding:4px 2px;font-size:9.5px;text-align:center;border:1px solid #057d45;position:sticky;z-index:4;}
  table.pdv-table thead tr:nth-child(1) th { top: 0; }
  table.pdv-table thead tr:nth-child(2) th { top: 22px; }
  table.pdv-table td{padding:2px 2px;text-align:center;border:1px solid var(--line);color:var(--ink);font-weight:600;}
  table.pdv-table input[type="text"]{width:48px;padding:2px;text-align:center;border:1px solid var(--line);border-radius:3px;font-size:10px;background:#fff;}
  table.pdv-table tr.total-row td{background:var(--green-light);font-weight:800;border-top:2px solid var(--green);}
  table.pdv-table th:nth-child(1), table.pdv-table td:nth-child(1){position:sticky;left:0;min-width:70px;z-index:2;}
  table.pdv-table th:nth-child(2), table.pdv-table td:nth-child(2){position:sticky;left:70px;min-width:52px;z-index:2;}
  table.pdv-table th:nth-child(3), table.pdv-table td:nth-child(3){position:sticky;left:122px;min-width:48px;z-index:2;}
  table.pdv-table th:nth-child(1), table.pdv-table th:nth-child(2), table.pdv-table th:nth-child(3){z-index:5;background:var(--green);}
  table.pdv-table td:nth-child(1), table.pdv-table td:nth-child(2), table.pdv-table td:nth-child(3){background:#fbfdfb;}
  table.pdv-table tr.total-row td:nth-child(1), table.pdv-table tr.total-row td:nth-child(2), table.pdv-table tr.total-row td:nth-child(3){background:var(--green-light);}
  .modal-overlay{ display:none;position:fixed;inset:0;background:rgba(15,30,20,.55); align-items:center;justify-content:center;z-index:100;padding:12px;}
  .modal{ background:#fff;border-radius:8px;width:100%;max-width:640px;max-height:80vh; overflow-y:auto;padding:14px 16px;}
  .modal h2{margin:0 0 2px;font-size:14px;color:var(--green-dark);}
  .modal .sub{font-size:11px;color:var(--muted);margin:0;}
  .modal h4{font-size:11.5px;color:var(--ink);margin:10px 0 4px;border-bottom:1px solid var(--line);padding-bottom:2px;}
  .map-row{display:grid;grid-template-columns:1fr 140px;gap:6px;align-items:center;padding:3px 0;border-bottom:1px solid #f0f2f0;}
  .map-row span{font-size:11.5px;}
  .map-row select{padding:3px 5px;border:1px solid var(--line);border-radius:5px;font-size:11.5px;width:100%;}
  .modal-topbar{ position:sticky;top:0;background:#fff;z-index:6; display:flex;align-items:flex-start;justify-content:space-between;gap:10px; padding-bottom:8px;margin-bottom:8px;border-bottom:1px solid var(--line);}
  .modal-topbar-actions{display:flex;gap:6px;align-items:center;flex-shrink:0;}
  .modal-close{background:none;border:none;font-size:16px;cursor:pointer;color:var(--muted);line-height:1;padding:2px;}
  .empty-map{font-size:11px;color:var(--muted);padding:4px 0;}
  @media print {
    @page { size: landscape; margin: 4mm; }
    body { background: #fff !important; padding: 0 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .topbar, .actions, .tabs, .btn, .upload-group, #settingsBtn, #exportXmlBtn, #exportHtmlBtn { display: none !important; }
    .card { box-shadow: none !important; border: 1px solid var(--line) !important; page-break-inside: avoid; margin-bottom: 4px !important; padding: 6px !important; }
    .wrap { max-width: 100% !important; padding: 0 !important; margin: 0 !important; }
    #dashboard { display: block !important; }
    .grid-top { margin-bottom: 4px !important; gap: 4px !important; }
    .grid-bottom { gap: 4px !important; }
    .chart-wrap { min-height: 140px !important; }
  }
  @media (max-width: 850px) {
    body { padding: 4px; }
    .grid-top, .grid-bottom { grid-template-columns: 1fr; }
    .actions { width: 100%; flex-direction: column; align-items: stretch; }
    .actions .btn, .actions .upload-group { width: 100%; }
    .file-status { position: relative; top: auto; right: auto; margin-top: 2px; text-align: center; display: block; }
    .btn { height: 38px; font-size: 12px; }
    .tab-btn { padding: 8px 12px; font-size: 12px; width: 100%; text-align: center; }
    .tabs { flex-wrap: wrap; }
    .chart-wrap { min-height: 180px; }
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="topbar">
    <div class="brand">
      <div class="brand-badge">SPI</div>
      <div>
        <h1>Diretoria SPI</h1>
        <p>Gerados diário</p>
      </div>

    <div class="actions">
      <button class="btn secondary" id="settingsBtn" type="button">⚙ Config.</button>
      <button class="btn secondary" id="exportXmlBtn" type="button">⬇ Baixar XML</button>
      <button class="btn accent" id="exportHtmlBtn" type="button">🔗 Compartilhar Painel (HTML)</button>
      <div class="upload-group">

      </div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" id="tabDashBtn" onclick="switchTab('dash')">📊 Painel Executivo</button>
    <button class="tab-btn" id="tabSimBtn" onclick="switchTab('sim')">📋 Simulação Plano de Voo</button>
  </div>

  <div class="warn-banner" id="unmappedWarning" style="display: none;"></div>

  <!-- ESTADO DE CARREGAMENTO (IMPORTANTE) -->
  <div id="emptyState" class="card empty-state" style="display: block;">
    <h2 id="loadingTitle">Buscando dados do GitHub...</h2>
    <p id="loadingMsg">Por favor, aguarde o download da base e das parametrizações.</p>
  </div>

  <!-- ---- ABA 1: PAINEL EXECUTIVO ---- -->
  <div id="tabDashContent">
    <div id="dashboard" style="display: none;">
      <!-- O conteúdo gerado pelas suas funções JS via manipulação de DOM vai preencher as divs originais que existiam aqui. Para brevidade, mantenha a estrutura original de containers se o seu JS já depende deles preenchidos. -->
      
      <!-- OBS: Se o seu JS popula essas tabelas automaticamente, você pode deixá-las vazias aqui -->
      <div class="grid-top">
        <div class="col-left">
          <div class="card kpi-card">

          </div>
          <div class="card spi-card">
              <!-- SUA TABELA SPI -->
          </div>
        </div>
        <div class="card chart-card">
            <!-- SEU GRÁFICO -->
        </div>
      </div>
    </div>
  </div>

  <!-- ---- ABA 2: SIMULAÇÃO PLANO DE VOO ---- -->
  <div id="tabSimContent" style="display:none;">
      <!-- SEU CONTEÚDO SIMULAÇÃO -->
  </div>

</div>

<!-- ---- Settings Modal ---- -->
<div class="modal-overlay" id="modalOverlay" style="display: none;">
  <div class="modal">
    <div class="modal-topbar">
      <div>
        <h2>Configurações</h2>
        <div class="sub">Faça o mapeamento dos empreendimentos para as respectivas SPIs.</div>
      </div>
      <div class="modal-topbar-actions">
        <button class="btn secondary" id="modalCancel" type="button">Fechar</button>
        <button class="btn" id="modalSave" type="button">Salvar</button>
        <button class="modal-close" id="modalClose" type="button">×</button>
      </div>
    </div>
    <h4>Mapeamento Empreendimento → SPI</h4>
    
    <!-- ESVAZIEI ESTA DIV, A LÓGICA DEVE PREENCHÊ-LA DINAMICAMENTE -->
    <div id="mapList"></div> 
    
    <div class="empty-map" id="mapEmptyMsg" style="display: none;">Nenhum dado de mapeamento disponível.</div>
  </div>
</div>

<!-- SCRIPTS DE DADOS EMBUTIDOS (AGORA VAZIOS/DINÂMICOS) -->

<script type="text/xml" id="embeddedData"></script>

<!-- LÓGICA DE FETCH (BUSCA) DIRETO DO GITHUB -->
<script>
  // ATENÇÃO: SUBSTITUA ESSAS URLs PELO CAMINHO 'RAW' CORRETO DO SEU GITHUB
  const GITHUB_BASE_URL = "https://raw.githubusercontent.com/SEU_USUARIO/SEU_REPOSITORIO/main/";
  const URL_XML = GITHUB_BASE_URL + "{DEDBD38E-D54E-DF11-AD89-001B78B9D994}";
  const URL_DE_PARA = GITHUB_BASE_URL + "de-para.json";

  async function loadDataFromGithub() {
    try {
      // 1. Busca a Planilha "De-Para" (em formato JSON)
      const mapResponse = await fetch(URL_DE_PARA, { cache: 'no-store' });
      if(mapResponse.ok) {
         const mappingData = await mapResponse.json();
         // Popula o estado com os dados do GitHub
         const stateElement = document.getElementById("embeddedState");
         let currentState = {};
         try { currentState = JSON.parse(stateElement.textContent || "{}"); } catch(e){}
         currentState.mappingOverrides = mappingData;
         stateElement.textContent = JSON.stringify(currentState);
      } else {
         console.warn("Aviso: Arquivo de-para.json não encontrado no GitHub.");
      }

      // 2. Busca o arquivo XML de atualizações
      const xmlResponse = await fetch(URL_XML, { cache: 'no-store' });
      if(xmlResponse.ok) {
         const xmlText = await xmlResponse.text();
         // Insere o texto bruto na tag, assim seu JS consegue continuar lendo de lá
         document.getElementById("embeddedData").textContent = xmlText;
         
         document.getElementById("loadingTitle").innerText = "Dados Carregados!";
         document.getElementById("loadingMsg").innerText = "Processando painel...";

         // --> AQUI VOCÊ DEVE CHAMAR A FUNÇÃO DO SEU JAVASCRIPT QUE INICIA A RENDERIZAÇÃO
         // Exemplo: 
         // initializeApp(); 
         // parseXmlAndRender();
         
         document.getElementById("emptyState").style.display = "none";
         document.getElementById("dashboard").style.display = "block";
         
      } else {
         throw new Error("Erro de resposta do GitHub: " + xmlResponse.status);
      }
    } catch (error) {
      console.error("Falha na sincronização do GitHub:", error);
      document.getElementById("loadingTitle").innerText = "Erro ao carregar os dados";
      document.getElementById("loadingMsg").innerText = "Houve um problema de conexão com o GitHub ou CORS. Verifique as URLs configuradas.";
    }
  }

  // Aciona a busca no GitHub assim que a interface estiver pronta
  window.addEventListener('DOMContentLoaded', loadDataFromGithub);
</script>
