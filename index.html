<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Diretoria SPI — Gerados Diário</title>

<!-- Biblioteca Chart.js para os gráficos -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<!-- Biblioteca SheetJS para ler o Excel (.xlsx) -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
  :root{
    --green-dark: #006B3F;
    --green: #079D56;
    --green-mid: #00D38D;
    --green-light: #E7F5ED;
    --ink: #1c2b22;
    --paper: #ffffff;
    --line: #d9e2dc;
    --muted: #6b7d72;
    --red: #e57373;
    --amber: #ffb74d;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Verdana', 'Segoe UI', system-ui, -apple-system, Arial, sans-serif;
    background:#eef2ef;
    color:var(--ink);
    padding:6px 10px;
    overflow-x: hidden;
  }
  .wrap{max-width:1380px;margin:0 auto;}

  .topbar{ display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px; margin-bottom:6px; background:var(--paper);padding:6px 12px 10px;border-radius:6px;border:1px solid var(--line); position:relative;z-index:10;}
  .brand{display:flex;align-items:center;gap:8px;}
  .brand-badge{ width:38px;height:38px;border-radius:50%; background:conic-gradient(from 200deg, var(--green) 0 60%, var(--green-mid) 60% 100%); display:flex;align-items:center;justify-content:center; color:#fff;font-size:9px;font-weight:700;text-align:center;line-height:1.1; border:2px solid var(--green-dark); }
  .brand h1{font-size:15px;margin:0;color:var(--green-dark);letter-spacing:.2px;}
  .brand p{margin:0;font-size:11px;color:var(--muted);font-weight:600;}
  
  .tabs{ display:flex;gap:6px;margin-bottom:6px;border-bottom:2px solid var(--line);padding-bottom:4px;}
  .tab-btn{ background:transparent;border:none;padding:4px 12px;font-size:11.5px;font-weight:700; color:var(--muted);cursor:pointer;border-radius:5px;transition:all .15s;}
  .tab-btn.active{ background:var(--green);color:#fff;}
  
  .grid-top{ display:grid;grid-template-columns:320px 1fr;gap:6px;margin-bottom:6px;}
  .col-left{ display:flex;flex-direction:column;gap:6px;}
  .card{ background:var(--paper);border-radius:6px;border:1px solid var(--line); box-shadow:0 1px 2px rgba(0,0,0,.03);}
  
  .empty-state{ text-align:center;padding:40px 20px;color:var(--muted);}
  .empty-state h2{color:var(--green-dark);font-size:15px;margin:0 0 4px;}
  .empty-state p{font-size:11.5px;max-width:360px;margin:0 auto;}
</style>
</head>
<body>

<div class="wrap">
  <!-- CABEÇALHO -->
  <div class="topbar">
    <div class="brand">
      <div class="brand-badge">SPI</div>
      <div>
        <h1>Diretoria SPI</h1>
        <p>Gerados diário</p>
      </div>
    </div>
  </div>

  <!-- ABAS -->
  <div class="tabs">
    <button class="tab-btn active" id="tabDashBtn">📊 Painel Executivo</button>
    <button class="tab-btn" id="tabSimBtn">📋 Simulação Plano de Voo</button>
  </div>

  <!-- TELA DE CARREGAMENTO -->
  <div id="emptyState" class="card empty-state" style="display: block;">
    <h2 id="loadingTitle">Buscando dados do GitHub...</h2>
    <p id="loadingMsg">Por favor, aguarde o download da base e das parametrizações.</p>
  </div>

  <!-- PAINEL PRINCIPAL -->
  <div id="dashboard" style="display: none;">
    <div class="grid-top">
      <div class="col-left">
        <div class="card kpi-card" id="kpiContainer"></div>
        <div class="card spi-card" id="spiTableContainer"></div>
      </div>
      <div class="card chart-card">
          <canvas id="meuGrafico"></canvas>
      </div>
    </div>
  </div>

</div>

<!-- ARMAZENAMENTO INVISÍVEL DOS DADOS PARA O SEU JS LER -->
<script type="application/json" id="embeddedState">{}</script>
<script type="text/xml" id="embeddedData"></script>


<!-- LÓGICA DE INTEGRAÇÃO COM GITHUB (EXCEL E XML) -->
<script>
  // Links configurados com os seus arquivos do GitHub
  const URL_EXCEL = "https://raw.githubusercontent.com/laurastorari/Gerados-SPI/refs/heads/main/Regionais.xlsx";
  const URL_XML = "https://raw.githubusercontent.com/laurastorari/Gerados-SPI/refs/heads/main/%7BDEDBD38E-D54E-DF11-AD89-001B78B9D994%7D.xml"; 
  
  async function loadDataFromGithub() {
    try {
      // 1. Busca a Planilha Excel (.xlsx) de De-Para
      console.log("Tentando baixar o Excel...");
      const excelResponse = await fetch(URL_EXCEL, { cache: 'no-store' });
      
      if(excelResponse.ok) {
         const arrayBuffer = await excelResponse.arrayBuffer();
         const workbook = XLSX.read(arrayBuffer, { type: 'array' });
         const primeiraAba = workbook.SheetNames[0];
         const worksheet = workbook.Sheets[primeiraAba];
         const mappingData = XLSX.utils.sheet_to_json(worksheet);
         
         let deParaFormatado = {};
         mappingData.forEach(linha => {
             let nomeEmp = linha["Empreendimento"]; 
             let nomeSpi = linha["SPI"];
             if(nomeEmp && nomeSpi) {
                 deParaFormatado[nomeEmp] = nomeSpi;
             }
         });
         
         const stateElement = document.getElementById("embeddedState");
         let currentState = {};
         try { currentState = JSON.parse(stateElement.textContent || "{}"); } catch(e){}
         currentState.mappingOverrides = deParaFormatado;
         stateElement.textContent = JSON.stringify(currentState);
         
         console.log("✅ Excel carregado e formatado com sucesso!");
      } else {
         console.error("❌ Erro 404: Excel não encontrado. Verifique a URL_EXCEL.");
      }

      // 2. Busca o arquivo XML com os dados de gerados
      console.log("Tentando baixar o XML...");
      const xmlResponse = await fetch(URL_XML, { cache: 'no-store' });
      
      if(xmlResponse.ok) {
         const xmlText = await xmlResponse.text();
         document.getElementById("embeddedData").textContent = xmlText;
         
         document.getElementById("loadingTitle").innerText = "Dados Carregados!";
         document.getElementById("loadingMsg").innerText = "Processando painel...";

         document.getElementById("emptyState").style.display = "none";
         document.getElementById("dashboard").style.display = "block";
         
         console.log("✅ XML carregado com sucesso!");
      } else {
         console.error("❌ Erro 404: XML não encontrado. Verifique a URL_XML.");
         throw new Error("Falha ao baixar o arquivo XML.");
      }
    } catch (error) {
      console.error("Falha geral na sincronização:", error);
      document.getElementById("loadingTitle").innerText = "Erro ao carregar os dados";
      document.getElementById("loadingMsg").innerText = "Verifique o Console (F12) para entender o erro nos links do GitHub.";
    }
  }

  window.addEventListener('DOMContentLoaded', loadDataFromGithub);
</script>

</script>

</body>
</html>
